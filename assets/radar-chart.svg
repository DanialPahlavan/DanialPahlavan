<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="radarBgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#060913" />
    </radialGradient>

    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="polyStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes vertexPulse {
        0%, 100% { r: 4.5; opacity: 0.85; filter: drop-shadow(0 0 2px #00f2fe); }
        50% { r: 6.5; opacity: 1; filter: drop-shadow(0 0 7px #00f2fe); }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.85; }
      }
      @keyframes corePulse {
        0%, 100% { r: 5; opacity: 0.8; }
        50% { r: 8; opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
      }

      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }

      .radar-bg { fill: url(#radarBgGlow); stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .radar-title { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 1px; fill: #94a3b8; }
      .radar-grid { fill: none; stroke: #1e293b; stroke-width: 1; }
      .radar-axis { stroke: #38bdf8; stroke-width: 1; stroke-dasharray: 3, 3; stroke-opacity: 0.45; }
      .radar-area { fill: url(#radarGrad); stroke: url(#polyStroke); stroke-width: 2.2; filter: url(#radarGlow); }
      .radar-point { stroke: #ffffff; stroke-width: 1.5; animation: vertexPulse 2.5s infinite; }
      .core-node { animation: corePulse 2s infinite; }
      
      .star-node { animation: starTwinkle 3s infinite; }
      .radar-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 10.5px; fill: #cbd5e1; font-weight: 600; }
      .radar-score { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: bold; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="340" class="radar-bg" />

  <!-- Background Synaptic Constellation Mesh -->
  <g stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.15" fill="#38bdf8">
    <line x1="80" y1="90" x2="140" y2="60" />
    <line x1="140" y1="60" x2="220" y2="80" />
    <line x1="80" y1="90" x2="100" y2="160" />
    <line x1="100" y1="160" x2="70" y2="240" />
    <line x1="70" y1="240" x2="150" y2="280" />
    
    <line x1="520" y1="90" x2="460" y2="60" />
    <line x1="460" y1="60" x2="380" y2="80" />
    <line x1="520" y1="90" x2="500" y2="160" />
    <line x1="500" y1="160" x2="530" y2="240" />
    <line x1="530" y1="240" x2="450" y2="280" />

    <circle cx="80" cy="90" r="1.8" class="star-node" fill="#00f2fe" />
    <circle cx="140" cy="60" r="1.8" class="star-node" fill="#38bdf8" />
    <circle cx="100" cy="160" r="1.8" class="star-node" fill="#c084fc" />
    <circle cx="70" cy="240" r="1.8" class="star-node" fill="#38bdf8" />
    <circle cx="150" cy="280" r="1.8" class="star-node" fill="#00f2fe" />

    <circle cx="520" cy="90" r="1.8" class="star-node" fill="#00f2fe" />
    <circle cx="460" cy="60" r="1.8" class="star-node" fill="#38bdf8" />
    <circle cx="500" cy="160" r="1.8" class="star-node" fill="#c084fc" />
    <circle cx="530" cy="240" r="1.8" class="star-node" fill="#38bdf8" />
    <circle cx="450" cy="280" r="1.8" class="star-node" fill="#00f2fe" />
  </g>

  <!-- Top Title Banner -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 590 0 C 595.523 0 600 4.477 600 10 L 600 32 L 0 32 Z" fill="#161b22" />
  <line x1="0" y1="32" x2="600" y2="32" stroke="#30363d" stroke-width="1" />
  
  <circle cx="18" cy="16" r="4" fill="#00f2fe" filter="url(#radarGlow)" />
  <text x="32" y="20" class="radar-title">AI RESEARCH &amp; SYSTEMS ARCHITECTURE RADAR</text>
  <text x="575" y="20" text-anchor="end" class="font-mono" font-size="10.5" fill="#38bdf8" font-weight="bold">[CORE AI COMPETENCIES]</text>

  <!-- Center (300, 180) Concentric Hexagons -->
  <!-- 25% Ring (R=25) -->
  <polygon points="300,155 321.65,167.5 321.65,192.5 300,205 278.35,192.5 278.35,167.5" class="radar-grid" />
  <!-- 50% Ring (R=50) -->
  <polygon points="300,130 343.3,155 343.3,205 300,230 256.7,205 256.7,155" class="radar-grid" />
  <!-- 75% Ring (R=75) -->
  <polygon points="300,105 364.95,142.5 364.95,217.5 300,255 235.05,217.5 235.05,142.5" class="radar-grid" />
  <!-- 100% Ring (R=100) -->
  <polygon points="300,80 386.6,130 386.6,230 300,280 213.4,230 213.4,130" stroke="#30363d" stroke-width="1.2" fill="none" />

  <!-- Synaptic Axon Rays -->
  <line x1="300" y1="180" x2="300" y2="80" class="radar-axis" />
  <line x1="300" y1="180" x2="386.6" y2="130" class="radar-axis" />
  <line x1="300" y1="180" x2="386.6" y2="230" class="radar-axis" />
  <line x1="300" y1="180" x2="300" y2="280" class="radar-axis" />
  <line x1="300" y1="180" x2="213.4" y2="230" class="radar-axis" />
  <line x1="300" y1="180" x2="213.4" y2="130" class="radar-axis" />

  <!-- Center Core Neuron -->
  <circle cx="300" cy="180" r="5.5" fill="#00f2fe" class="core-node" />

  <!-- Radar Filled Polygon -->
  <polygon points="300,81 384.9,131 383.1,228 300,275 216.0,228.5 220.3,134" class="radar-area" />

  <!-- Vertices Circles -->
  <circle cx="300" cy="81" r="4.5" class="radar-point" fill="#00f2fe" />
  <circle cx="384.9" cy="131" r="4.5" class="radar-point" fill="#38bdf8" />
  <circle cx="383.1" cy="228" r="4.5" class="radar-point" fill="#c084fc" />
  <circle cx="300" cy="275" r="4.5" class="radar-point" fill="#34d399" />
  <circle cx="216.0" cy="228.5" r="4.5" class="radar-point" fill="#38bdf8" />
  <circle cx="220.3" cy="134" r="4.5" class="radar-point" fill="#00f2fe" />

  <!-- Axis Labels & Real Repository Pillars -->
  <!-- Top: Deep Learning & CV -->
  <text x="300" y="56" text-anchor="middle" class="radar-label">Computer Vision &amp; Deep Learning</text>
  <text x="300" y="70" text-anchor="middle" class="radar-score" fill="#00f2fe">VCGAN • DeOldify • YOLO</text>

  <!-- Top Right: Autonomous Agents -->
  <text x="404" y="125" class="radar-label">Autonomous AI Agents</text>
  <text x="404" y="138" class="radar-score" fill="#38bdf8">ReAct &amp; Reflexion Loops</text>

  <!-- Bottom Right: RAG & NLP -->
  <text x="404" y="231" class="radar-label">Dense RAG &amp; NLP Models</text>
  <text x="404" y="244" class="radar-score" fill="#c084fc">Atlas • KoRC • Retrieval</text>

  <!-- Bottom: 1-Bit Quantization -->
  <text x="300" y="301" text-anchor="middle" class="radar-label">1-Bit Neural Quantization</text>
  <text x="300" y="314" text-anchor="middle" class="radar-score" fill="#34d399">Wide ResNets • Edge Deploy</text>

  <!-- Bottom Left: Data Science & ML -->
  <text x="196" y="231" text-anchor="end" class="radar-label">Data Science &amp; ML Ecosystem</text>
  <text x="196" y="244" text-anchor="end" class="radar-score" fill="#38bdf8">Scikit-Learn • PyTorch</text>

  <!-- Top Left: AI Runtime & Compute -->
  <text x="196" y="125" text-anchor="end" class="radar-label">GPU Runtime &amp; Acceleration</text>
  <text x="196" y="138" text-anchor="end" class="radar-score" fill="#00f2fe">CUDA 12.x • TensorRT</text>
</svg>
