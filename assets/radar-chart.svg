<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="polyStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes radarPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      .radar-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .radar-title { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 12px; font-weight: bold; letter-spacing: 1.5px; fill: #8b949e; }
      .radar-grid { fill: none; stroke: #21262d; stroke-width: 1; }
      .radar-axis { stroke: #30363d; stroke-width: 1; stroke-dasharray: 2, 2; }
      .radar-area { fill: url(#radarGrad); stroke: url(#polyStroke); stroke-width: 2.2; filter: url(#radarGlow); }
      .radar-point { fill: #00f2fe; stroke: #ffffff; stroke-width: 1.5; }
      .radar-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; fill: #cbd5e1; font-weight: 500; }
      .radar-score { font-family: 'Fira Code', monospace; font-size: 10px; font-weight: bold; fill: #00f2fe; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="320" class="radar-bg" />

  <!-- Top Title Banner -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 590 0 C 595.523 0 600 4.477 600 10 L 600 32 L 0 32 Z" fill="#161b22" />
  <line x1="0" y1="32" x2="600" y2="32" stroke="#30363d" stroke-width="1" />
  <circle cx="18" cy="16" r="4" fill="#00f2fe" filter="url(#radarGlow)" />
  <text x="32" y="20" class="radar-title">AI RESEARCH &amp; SYSTEMS ARCHITECTURE RADAR</text>
  <text x="575" y="20" text-anchor="end" class="radar-title" fill="#38bdf8">97.8% COMPOSITE</text>

  <!-- Center (300, 170) Concentric Hexagons -->
  <!-- 25% Ring -->
  <polygon points="300,145 321.6,157.5 321.6,182.5 300,195 278.4,182.5 278.4,157.5" class="radar-grid" />
  <!-- 50% Ring -->
  <polygon points="300,120 343.3,145 343.3,195 300,220 256.7,195 256.7,145" class="radar-grid" />
  <!-- 75% Ring -->
  <polygon points="300,95 365,132.5 365,207.5 300,245 235,207.5 235,132.5" class="radar-grid" />
  <!-- 100% Ring -->
  <polygon points="300,70 386.6,120 386.6,220 300,270 213.4,220 213.4,120" stroke="#30363d" stroke-width="1.2" fill="none" />

  <!-- Axes -->
  <line x1="300" y1="170" x2="300" y2="70" class="radar-axis" />
  <line x1="300" y1="170" x2="386.6" y2="120" class="radar-axis" />
  <line x1="300" y1="170" x2="386.6" y2="220" class="radar-axis" />
  <line x1="300" y1="170" x2="300" y2="270" class="radar-axis" />
  <line x1="300" y1="170" x2="213.4" y2="220" class="radar-axis" />
  <line x1="300" y1="170" x2="213.4" y2="120" class="radar-axis" />

  <!-- Radar Filled Polygon (Scores: 99%, 98%, 96%, 95%, 97%, 92%) -->
  <polygon points="300,71 384.8,121 383.1,218 300,265 216,218.5 220.3,124" class="radar-area" />

  <!-- Vertices Circles -->
  <circle cx="300" cy="71" r="4.5" class="radar-point" />
  <circle cx="384.8" cy="121" r="4.5" class="radar-point" fill="#38bdf8" />
  <circle cx="383.1" cy="218" r="4.5" class="radar-point" fill="#8A2BE2" />
  <circle cx="300" cy="265" r="4.5" class="radar-point" fill="#10b981" />
  <circle cx="216" cy="218.5" r="4.5" class="radar-point" fill="#38bdf8" />
  <circle cx="220.3" cy="124" r="4.5" class="radar-point" fill="#00f2fe" />

  <!-- Axis Labels & Scores -->
  <!-- Top: Deep Learning & CV -->
  <text x="300" y="52" text-anchor="middle" class="radar-label" font-weight="600">Deep Learning &amp; Computer Vision</text>
  <text x="300" y="64" text-anchor="middle" class="radar-score">99%</text>

  <!-- Top Right: Autonomous Agents -->
  <text x="402" y="115" class="radar-label" font-weight="600">Autonomous Agents</text>
  <text x="402" y="128" class="radar-score" fill="#38bdf8">98% • ReAct/Reflexion</text>

  <!-- Bottom Right: RAG & NLP -->
  <text x="402" y="222" class="radar-label" font-weight="600">RAG &amp; Dense Retrieval</text>
  <text x="402" y="235" class="radar-score" fill="#c084fc">96% • Atlas / KoRC</text>

  <!-- Bottom: 1-Bit Quantization -->
  <text x="300" y="290" text-anchor="middle" class="radar-label" font-weight="600">1-Bit Neural Quantization</text>
  <text x="300" y="303" text-anchor="middle" class="radar-score" fill="#10b981">95% • 4.8x Acceleration</text>

  <!-- Bottom Left: Async Python Systems -->
  <text x="198" y="222" text-anchor="end" class="radar-label" font-weight="600">Async Python Systems</text>
  <text x="198" y="235" text-anchor="end" class="radar-score" fill="#38bdf8">97% • aiogram / Concurrency</text>

  <!-- Top Left: Systems & C# / C++ -->
  <text x="198" y="115" text-anchor="end" class="radar-label" font-weight="600">Systems &amp; C# / C++</text>
  <text x="198" y="128" text-anchor="end" class="radar-score" fill="#00f2fe">92% • Tooling / Runtime</text>
</svg>
