<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <defs>
    <linearGradient id="stackHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="stackCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <filter id="stackGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes stackCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .stack-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .stack-header { fill: url(#stackHeaderGrad); rx: 10px; }
      .stack-title { fill: #8b949e; font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
      
      .font-mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
      .font-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
      
      .prompt-cmd { fill: #00f2fe; font-weight: bold; }
      .card-box { fill: url(#stackCardGrad); stroke: #30363d; stroke-width: 1.2; rx: 6px; }
      .card-title { font-family: 'Fira Code', monospace; font-size: 11px; font-weight: bold; letter-spacing: 0.5px; }
      .card-body { font-family: 'Segoe UI', sans-serif; font-size: 11.5px; fill: #cbd5e1; font-weight: 500; }
      .tag-pill { font-family: 'Fira Code', monospace; font-size: 9.5px; }
      .cursor-blink { animation: stackCursor 1s infinite; fill: #00f2fe; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="430" class="stack-bg" />

  <!-- Window Header Bar -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 840 0 C 845.523 0 850 4.477 850 10 L 850 34 L 0 34 Z" class="stack-header" />
  <line x1="0" y1="34" x2="850" y2="34" stroke="#30363d" stroke-width="1" />

  <!-- Window Control Buttons -->
  <circle cx="20" cy="17" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="17" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="17" r="5.5" fill="#27c93f" />

  <!-- Title -->
  <text x="425" y="22" text-anchor="middle" class="stack-title">danial@ai-lab: ~/matrix/stack_config.json --verified-technologies</text>

  <!-- Content Body -->
  <g transform="translate(24, 50)">
    
    <!-- Command Line -->
    <text y="14" class="font-mono" font-size="12.5">
      <tspan fill="#8b949e">danial@ai-lab:~$</tspan> <tspan class="prompt-cmd">sysctl --get-verified-stack --all-domains</tspan>
    </text>

    <!-- ROW 1 (y = 30) -->
    <!-- Block 1: Deep Learning & CV -->
    <g transform="translate(0, 30)">
      <rect width="390" height="88" class="card-box" stroke="#00f2fe" stroke-opacity="0.5" />
      <circle cx="16" cy="20" r="3.5" fill="#00f2fe" />
      <text x="26" y="23" class="card-title" fill="#00f2fe">01. DEEP LEARNING &amp; COMPUTER VISION</text>
      <text x="14" y="48" class="card-body">PyTorch • TensorFlow • Keras • OpenCV</text>
      <text x="14" y="68" class="card-body">YOLO (v5/v8/v11) • GANs (DeOldify/VCGAN) • HuggingFace</text>
    </g>

    <!-- Block 2: Autonomous Agents & RAG -->
    <g transform="translate(412, 30)">
      <rect width="390" height="88" class="card-box" stroke="#c084fc" stroke-opacity="0.5" />
      <circle cx="16" cy="20" r="3.5" fill="#c084fc" />
      <text x="26" y="23" class="card-title" fill="#c084fc">02. AUTONOMOUS AGENTS &amp; DENSE RAG</text>
      <text x="14" y="48" class="card-body">ReAct &amp; Reflexion Loops • LangChain</text>
      <text x="14" y="68" class="card-body">Atlas Dense RAG • KoRC • 1-Bit Quantization (4.8x)</text>
    </g>

    <!-- ROW 2 (y = 130) -->
    <!-- Block 3: Programming & Systems -->
    <g transform="translate(0, 130)">
      <rect width="390" height="88" class="card-box" stroke="#38bdf8" stroke-opacity="0.5" />
      <circle cx="16" cy="20" r="3.5" fill="#38bdf8" />
      <text x="26" y="23" class="card-title" fill="#38bdf8">03. PROGRAMMING &amp; SYSTEMS LANGUAGES</text>
      <text x="14" y="48" class="card-body">Python (AsyncIO) • C# (.NET) • C++</text>
      <text x="14" y="68" class="card-body">TypeScript • JavaScript • Bash • SQL (PostgreSQL)</text>
    </g>

    <!-- Block 4: Data Science & ML -->
    <g transform="translate(412, 130)">
      <rect width="390" height="88" class="card-box" stroke="#f59e0b" stroke-opacity="0.5" />
      <circle cx="16" cy="20" r="3.5" fill="#f59e0b" />
      <text x="26" y="23" class="card-title" fill="#f59e0b">04. DATA SCIENCE &amp; ML ECOSYSTEM</text>
      <text x="14" y="48" class="card-body">Scikit-Learn • NumPy • Pandas</text>
      <text x="14" y="68" class="card-body">Jupyter Lab • High-Dimensional Tensor Operations</text>
    </g>

    <!-- ROW 3 (y = 230) -->
    <!-- Block 5: Bot & GUI Frameworks -->
    <g transform="translate(0, 230)">
      <rect width="390" height="88" class="card-box" stroke="#22d3ee" stroke-opacity="0.5" />
      <circle cx="16" cy="20" r="3.5" fill="#22d3ee" />
      <text x="26" y="23" class="card-title" fill="#22d3ee">05. BOT FRAMEWORKS &amp; DESKTOP GUIS</text>
      <text x="14" y="48" class="card-body">aiogram (Async Telegram Engine) • Telegram Bot API</text>
      <text x="14" y="68" class="card-body">Tkinter GUI Architectures • Unity Game Engine</text>
    </g>

    <!-- Block 6: Runtime & Infrastructure -->
    <g transform="translate(412, 230)">
      <rect width="390" height="88" class="card-box" stroke="#34d399" stroke-opacity="0.5" />
      <circle cx="16" cy="20" r="3.5" fill="#34d399" />
      <text x="26" y="23" class="card-title" fill="#34d399">06. RUNTIME &amp; INFRASTRUCTURE</text>
      <text x="14" y="48" class="card-body">Linux Workstation Clusters • Docker Containers</text>
      <text x="14" y="68" class="card-body">Git SCM • CUDA 12.x GPU Runtime • OpenCore</text>
    </g>

    <!-- Terminal Footer Status Line -->
    <g transform="translate(0, 342)">
      <text class="font-mono" font-size="12" fill="#8b949e">
        danial@ai-lab:~$ <tspan fill="#00f2fe">echo $STACK_STATUS</tspan> <tspan fill="#22c55e">[ALL 6 DOMAINS OPERATIONAL &amp; VERIFIED]</tspan>
        <tspan class="cursor-blink" dx="6">█</tspan>
      </text>
    </g>

  </g>
</svg>
