<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulseFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .flow-line {
        stroke: #00f2fe;
        stroke-width: 2;
        stroke-dasharray: 6, 6;
        animation: pulseFlow 1.2s linear infinite;
      }
      .flow-line-purple {
        stroke: #c084fc;
        stroke-width: 2;
        stroke-dasharray: 6, 6;
        animation: pulseFlow 1.2s linear infinite;
      }
      .flow-line-green {
        stroke: #34d399;
        stroke-width: 2;
        stroke-dasharray: 6, 6;
        animation: pulseFlow 1.2s linear infinite;
      }
      .node-card {
        fill: url(#boxGrad);
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 8px;
        transition: all 0.3s;
      }
      .node-card:hover {
        stroke: #00f2fe;
      }
      .title-text {
        font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #8b949e;
      }
      .node-header {
        font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
      }
      .node-body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-size: 11.5px;
        fill: #cbd5e1;
      }
      .node-sub {
        font-family: 'Fira Code', 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="240" fill="#0d1117" stroke="#30363d" stroke-width="1.5" rx="10" />

  <!-- Top Title Banner -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 32 L 0 32 Z" fill="#161b22" />
  <line x1="0" y1="32" x2="800" y2="32" stroke="#30363d" stroke-width="1" />
  <circle cx="18" cy="16" r="4.5" fill="#00f2fe" filter="url(#glow)" />
  <text x="32" y="20" class="title-text">DANIAL PAHLAVAN • AUTONOMOUS AI SYSTEMS &amp; COMPUTE TOPOLOGY</text>
  <text x="770" y="20" text-anchor="end" class="title-text" fill="#38bdf8">2026 ACTIVE</text>

  <!-- Connecting Animated Data Buses -->
  <!-- Node 1 to 2 -->
  <path d="M 185 130 L 225 130" class="flow-line" />
  <polygon points="225,126 233,130 225,134" fill="#00f2fe" />

  <!-- Node 2 to 3 -->
  <path d="M 380 130 L 420 130" class="flow-line-purple" />
  <polygon points="420,126 428,130 420,134" fill="#c084fc" />

  <!-- Node 3 to 4 -->
  <path d="M 575 130 L 615 130" class="flow-line-green" />
  <polygon points="615,126 623,130 615,134" fill="#34d399" />

  <!-- Node 1: Vision Perception -->
  <g transform="translate(30, 52)">
    <rect width="155" height="156" class="node-card" stroke="#00f2fe" stroke-opacity="0.6" />
    <rect x="0" y="0" width="155" height="26" fill="#00f2fe" fill-opacity="0.12" rx="8" />
    <circle cx="14" cy="13" r="3.5" fill="#00f2fe" />
    <text x="25" y="17" fill="#00f2fe" class="node-header">01. PERCEPTION</text>
    
    <text x="12" y="50" class="node-body" font-weight="600">• YOLO (v5/v8/v11)</text>
    <text x="12" y="70" class="node-body">• GAN Colorization</text>
    <text x="12" y="90" class="node-body">• DeOldify / VCGAN</text>
    <text x="12" y="110" class="node-body">• OpenCV &amp; PyTorch</text>
    <line x1="12" y1="124" x2="143" y2="124" stroke="#30363d" stroke-width="1" />
    <text x="12" y="142" class="node-sub" fill="#00f2fe">THROUGHPUT: 60+ FPS</text>
  </g>

  <!-- Node 2: Knowledge & RAG -->
  <g transform="translate(225, 52)">
    <rect width="155" height="156" class="node-card" stroke="#38bdf8" stroke-opacity="0.6" />
    <rect x="0" y="0" width="155" height="26" fill="#38bdf8" fill-opacity="0.12" rx="8" />
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8" />
    <text x="25" y="17" fill="#38bdf8" class="node-header">02. KNOWLEDGE</text>
    
    <text x="12" y="50" class="node-body" font-weight="600">• Dense Vector RAG</text>
    <text x="12" y="70" class="node-body">• Atlas Few-Shot</text>
    <text x="12" y="90" class="node-body">• KoRC Comprehension</text>
    <text x="12" y="110" class="node-body">• Semantic Indexing</text>
    <line x1="12" y1="124" x2="143" y2="124" stroke="#30363d" stroke-width="1" />
    <text x="12" y="142" class="node-sub" fill="#38bdf8">HIT RATE: 98.4%</text>
  </g>

  <!-- Node 3: Autonomous Cognition -->
  <g transform="translate(420, 52)">
    <rect width="155" height="156" class="node-card" stroke="#a78bfa" stroke-opacity="0.6" />
    <rect x="0" y="0" width="155" height="26" fill="#a78bfa" fill-opacity="0.12" rx="8" />
    <circle cx="14" cy="13" r="3.5" fill="#a78bfa" />
    <text x="25" y="17" fill="#c084fc" class="node-header">03. COGNITION</text>
    
    <text x="12" y="50" class="node-body" font-weight="600">• ReAct Reasoning</text>
    <text x="12" y="70" class="node-body">• Reflexion Loops</text>
    <text x="12" y="90" class="node-body">• Tool Orchestration</text>
    <text x="12" y="110" class="node-body">• Multi-Agent Core</text>
    <line x1="12" y1="124" x2="143" y2="124" stroke="#30363d" stroke-width="1" />
    <text x="12" y="142" class="node-sub" fill="#c084fc">STATUS: ACTIVE LOOP</text>
  </g>

  <!-- Node 4: Quantization & Runtime -->
  <g transform="translate(615, 52)">
    <rect width="155" height="156" class="node-card" stroke="#10b981" stroke-opacity="0.6" />
    <rect x="0" y="0" width="155" height="26" fill="#10b981" fill-opacity="0.12" rx="8" />
    <circle cx="14" cy="13" r="3.5" fill="#10b981" />
    <text x="25" y="17" fill="#34d399" class="node-header">04. EDGE RUNTIME</text>
    
    <text x="12" y="50" class="node-body" font-weight="600">• 1-Bit Quantization</text>
    <text x="12" y="70" class="node-body">• TensorRT / ONNX</text>
    <text x="12" y="90" class="node-body">• CUDA 12.x Runtime</text>
    <text x="12" y="110" class="node-body">• Linux Clusters</text>
    <line x1="12" y1="124" x2="143" y2="124" stroke="#30363d" stroke-width="1" />
    <text x="12" y="142" class="node-sub" fill="#34d399">ACCEL: 4.8X BOOST</text>
  </g>
</svg>
